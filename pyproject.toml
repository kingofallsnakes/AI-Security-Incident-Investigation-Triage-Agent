[build-system]
requires = ["setuptools>=69,<80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-security-incident-triage"
version = "0.1.0"
description = "Human-supervised, read-only security incident investigation demo"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.3",
  "fastapi==0.162.3",
  "uvicorn==0.54.0",
  "elasticsearch==9.5.1",
  "langgraph==1.2.20",
  "pandas==3.1.1",
  "httpx==0.28.1",
  "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
